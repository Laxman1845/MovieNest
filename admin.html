<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MovieNest - Admin Control Panel</title>
    <!-- Vercel Web Analytics -->
    <script>
      window.va =
        window.va ||
        function () {
          (window.vaq = window.vaq || []).push(arguments);
        };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen">
    <!-- Independent Admin Login Gate (Shown when not authenticated as admin) -->
    <div
      id="admin-auth-container"
      class="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center p-4"
    >
      <div
        class="glass-panel bg-slate-900/90 border border-slate-800 p-8 rounded-3xl w-full max-w-md shadow-2xl relative"
      >
        <div class="text-center mb-6">
          <span
            class="text-xs font-bold tracking-widest text-rose-500 uppercase"
            >Restricted Access</span
          >
          <h2 class="text-2xl font-black text-white mt-1">Admin Portal</h2>
          <p class="text-xs text-slate-400 mt-1">
            Enter your authorized admin credentials.
          </p>
        </div>

        <form
          id="admin-login-form"
          onsubmit="handleAdminLogin(event)"
          class="space-y-4"
        >
          <div>
            <label
              class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1"
              >Admin Email</label
            >
            <input
              type="email"
              id="admin-email"
              required
              class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-rose-500 text-sm"
            />
          </div>
          <div>
            <label
              class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1"
              >Password</label
            >
            <input
              type="password"
              id="admin-password"
              required
              class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-rose-500 text-sm"
            />
          </div>
          <button
            type="submit"
            class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-rose-600/30 text-sm"
          >
            Authenticate
          </button>
        </form>

        <div class="mt-6 text-center">
          <a
            href="index.html"
            class="text-xs text-slate-500 hover:text-slate-300 transition"
            >&larr; Back to Main Website</a
          >
        </div>
      </div>
    </div>

    <!-- Main Admin Dashboard Wrapper (Hidden until verified) -->
    <div
      id="admin-dashboard-container"
      class="hidden max-w-7xl mx-auto px-4 py-8"
    >
      <div
        class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4"
      >
        <div>
          <h1 class="text-3xl font-black text-rose-500">Admin Control Panel</h1>
          <p class="text-xs text-slate-400 mt-1">
            Authorized as:
            <span id="admin-user-email" class="text-white font-bold"></span>
          </p>
        </div>
        <div class="flex gap-4">
          <a
            href="index.html"
            class="bg-slate-900 border border-slate-800 hover:bg-slate-800 px-4 py-2 rounded-xl text-xs font-bold transition flex items-center"
            >Home</a
          >
          <button
            onclick="handleAdminLogout()"
            class="bg-rose-600/20 hover:bg-rose-600 text-rose-400 hover:text-white px-4 py-2 rounded-xl text-xs font-bold transition"
          >
            Logout
          </button>
        </div>
      </div>

      <!-- Dashboard Statistics Cards -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 mb-8">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
          <p
            class="text-xs text-slate-400 font-bold uppercase tracking-wider mb-1"
          >
            Total Movies
          </p>
          <h3 id="stat-total-movies" class="text-3xl font-black text-white">
            0
          </h3>
        </div>
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
          <p
            class="text-xs text-slate-400 font-bold uppercase tracking-wider mb-1"
          >
            Total Bookings
          </p>
          <h3 id="stat-total-bookings" class="text-3xl font-black text-white">
            0
          </h3>
        </div>
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
          <p
            class="text-xs text-slate-400 font-bold uppercase tracking-wider mb-1"
          >
            Total Revenue
          </p>
          <h3 id="stat-total-revenue" class="text-3xl font-black text-rose-500">
            ₹0
          </h3>
        </div>
      </div>

      <!-- Add Movie Form -->
      <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl mb-8">
        <h2 class="text-xl font-bold mb-4">Add New Movie</h2>
        <form
          id="add-movie-form"
          onsubmit="handleAddMovie(event)"
          class="grid grid-cols-1 sm:grid-cols-2 gap-4"
        >
          <input
            type="text"
            id="admin-movie-title"
            placeholder="Movie Title"
            required
            class="bg-slate-950 border border-slate-800 px-4 py-3 rounded-xl text-sm text-white"
          />
          <input
            type="text"
            id="admin-movie-genre"
            placeholder="Genre (e.g. Action / Thriller)"
            required
            class="bg-slate-950 border border-slate-800 px-4 py-3 rounded-xl text-sm text-white"
          />
          <input
            type="url"
            id="admin-movie-poster"
            placeholder="Poster Image URL"
            required
            class="bg-slate-950 border border-slate-800 px-4 py-3 rounded-xl text-sm text-white"
          />
          <input
            type="text"
            id="admin-movie-desc"
            placeholder="Short Description"
            required
            class="bg-slate-950 border border-slate-800 px-4 py-3 rounded-xl text-sm text-white"
          />
          <button
            type="submit"
            class="col-span-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-rose-600/30 text-sm"
          >
            Publish Movie
          </button>
        </form>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
        <!-- Manage Movies -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
          <h2 class="text-xl font-bold mb-4">Manage Movies</h2>
          <div
            id="admin-movies-list"
            class="space-y-3 max-h-[400px] overflow-y-auto pr-2"
          >
            <p class="text-slate-500 text-sm">Loading movies...</p>
          </div>
        </div>

        <!-- All Bookings Overview -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
          <h2 class="text-xl font-bold mb-4">All Customer Bookings</h2>
          <div
            id="admin-bookings-list"
            class="space-y-3 max-h-[400px] overflow-y-auto pr-2"
          >
            <p class="text-slate-500 text-sm">Loading bookings...</p>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="js/admin.js"></script>
  </body>
</html>
